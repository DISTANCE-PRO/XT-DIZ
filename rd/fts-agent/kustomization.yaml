apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: rd-fts-

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: fts
    app.kubernetes.io/component: agent

configMapGenerator:
- name: agent-config
  files:
  - application.yaml
- name: agent-projects
  files:
  - projects/distance.yaml

resources:
- service.yaml
- workload.yaml
