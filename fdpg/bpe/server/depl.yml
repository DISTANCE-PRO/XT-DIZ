apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdpg-bpe-server
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: {}
  template:
    metadata:
      labels:
        app.life.uni-leipzig.de/redundancy: none
        app.life.uni-leipzig.de/service-level: silver
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 2202
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 2202
        runAsUser: 2202
      initContainers:
      - name: download-process-plugins
        image: mikefarah/yq:4.53.3
        command: ["/bin/sh", "/scripts/download-plugins.sh"]
        volumeMounts:
        - name: process-plugins
          mountPath: /opt/bpe/process
        - name: download-plugins-script
          mountPath: /scripts
      - name: generate-truststore
        image: alpine/openssl:3.5.7
        command:
          - /bin/sh
          - -c
          - |
            openssl pkcs12 \
            -in /run/secrets/life-ca-certs/life-root-ca-2.pem \
            -out /run/secrets/truststore/truststore.p12 \
            -jdktrust anyExtendedKeyUsage \
            -export -nokeys -keypbe NONE -certpbe NONE -nomaciter -passout pass:password
        volumeMounts:
        - name: truststore
          mountPath: /run/secrets/truststore
        - name: ca-certs
          mountPath: /run/secrets/life-ca-certs
      containers:
      - name: bpe
        image: ghcr.io/datasharingframework/bpe:2.1.0
        ports:
        - name: http
          containerPort: 8080
        - name: health
          containerPort: 10000
        env:
        - name: DEV_DSF_SERVER_STATUS_HOST
          value: "0.0.0.0"
        - name: DEV_DSF_SERVER_STATUS_PORT
          value: "10000"
        - name: DEV_DSF_BPE_DB_LIQUIBASE_USERNAME
          value: liquibase_user
        - name: DEV_DSF_BPE_DB_LIQUIBASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: credentials
              key: FDPG_DSF_BPE_DB_LIQUIBASE_PASSWORD
        - name: DEV_DSF_BPE_DB_USER_ENGINE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: credentials
              key: FDPG_DSF_BPE_DB_USER_ENGINE_PASSWORD
        - name: DEV_DSF_BPE_DB_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: credentials
              key: FDPG_DSF_BPE_DB_USER_PASSWORD
        - name: DEV_DSF_BPE_DB_URL
          value: "jdbc:postgresql://fdpg-bpe-db/bpe"
        - name: DEV_DSF_BPE_FHIR_SERVER_BASE_URL
          value: "https://${DIZ_NAME}.distance-xt.life.uni-leipzig.de/fhir"
        - name: DEV_DSF_BPE_FHIR_CLIENT_CERTIFICATE
          value: "/run/secrets/creds/dsf/cert.pem"
        - name: DEV_DSF_BPE_FHIR_CLIENT_CERTIFICATE_PRIVATE_KEY
          value: "/run/secrets/creds/dsf/key.pem"
        - name: DEV_DSF_BPE_FHIR_CLIENT_CERTIFICATE_PRIVATE_KEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: credentials
              key: FDPG_PRIVATE_KEY_PASSWORD
        - name: DEV_DSF_BPE_PROCESS_EXCLUDED
          valueFrom:
            configMapKeyRef:
              name: bpe-process-config
              key: DEV_DSF_BPE_PROCESS_EXCLUDED
        - name: DEV_DSF_BPE_FHIR_CLIENT_CONNECTIONS_CONFIG
          value: |
            fhir-store:
              base-url: "https://rd.${DIZ_NAME}.distance-xt.life.uni-leipzig.local/fhir"
              test-connection-on-startup: yes
              trusted-root-certificates-file: /run/secrets/life-ca-certs/life-root-ca-2.pem
              oidc-auth:
                base-url: "https://auth.distance-xt.life.uni-leipzig.local/realms/diz-${DIZ_NAME}"
                client-id: "fdpg-dsf-bpe-rd-hds"
                client-secret-file: "/run/secrets/creds/common/fdpg_dsf_bpe_rd_hds_client_secret.password"
                test-connection-on-startup: yes
                trusted-root-certificates-file: /run/secrets/life-ca-certs/life-root-ca-2.pem
        # Feasibility Plugin
        - name: DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_BASE_URL
          value: "https://rd.${DIZ_NAME}.distance-xt.life.uni-leipzig.local/fhir"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_AUTH_OAUTH_ISSUER_URL
          value: "https://auth.distance-xt.life.uni-leipzig.local/realms/diz-${DIZ_NAME}"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_AUTH_OAUTH_CLIENT_ID
          value: "fdpg-dsf-bpe-rd-hds"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_AUTH_OAUTH_CLIENT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: credentials
              key: FDPG_DSF_BPE_RD_HDS_CLIENT_SECRET
        - name: DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_TRUST_STORE_PATH
          value: "/run/secrets/truststore/truststore.p12"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_TRUST_STORE_PASSWORD
          value: "password"
        # Report Plugin
        - name: DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_FHIR_SERVER_ID
          value: "fhir-store"
        # Data Transfer Plugin
        ## DIC fhir store 
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_BASE_URL
          value: "https://rd.${DIZ_NAME}.distance-xt.life.uni-leipzig.local/fhir"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_OAUTH2_URL
          value: "https://auth.distance-xt.life.uni-leipzig.local/realms/diz-${DIZ_NAME}"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_OAUTH2_CLIENT_ID
          value: "fdpg-dsf-bpe-rd-hds"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_OAUTH2_CLIENT_PASSWORD_FILE
          value: /run/secrets/creds/common/fdpg_dsf_bpe_rd_hds_client_secret.password
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_OAUTH2_TRUST_CERTIFICATES
          value: "/run/secrets/life-ca-certs/life-root-ca-2.pem"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_TRUST_CERTIFICATES
          value: "/run/secrets/life-ca-certs/life-root-ca-2.pem"
        ## DMS fhir store
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DMS_FHIR_SERVER_BASE_URL
          value: "https://rd.${DIZ_NAME}.distance-xt.life.uni-leipzig.local/fhir"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DMS_FHIR_SERVER_OAUTH2_URL
          value: "https://auth.distance-xt.life.uni-leipzig.local/realms/diz-${DIZ_NAME}"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DMS_FHIR_SERVER_OAUTH2_CLIENT_ID
          value: "fdpg-dsf-bpe-rd-hds"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DMS_FHIR_SERVER_OAUTH2_CLIENT_PASSWORD_FILE
          value: /run/secrets/creds/common/fdpg_dsf_bpe_rd_hds_client_secret.password
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DMS_FHIR_SERVER_OAUTH2_TRUST_CERTIFICATES
          value: "/run/secrets/life-ca-certs/life-root-ca-2.pem"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DMS_FHIR_SERVER_TRUST_CERTIFICATES
          value: "/run/secrets/life-ca-certs/life-root-ca-2.pem"
        # Data Sharing Plugin
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_BASE_URL
          value: "https://rd.${DIZ_NAME}.distance-xt.life.uni-leipzig.local/fhir"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_OAUTH2_URL
          value: "https://auth.distance-xt.life.uni-leipzig.local/realms/diz-${DIZ_NAME}"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_OAUTH2_CLIENT_ID
          value: "fdpg-dsf-bpe-rd-hds"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_OAUTH2_CLIENT_PASSWORD_FILE
          value: /run/secrets/creds/common/fdpg_dsf_bpe_rd_hds_client_secret.password
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_OAUTH2_TRUST_CERTIFICATES
          value: "/run/secrets/life-ca-certs/life-root-ca-2.pem"
        - name: DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_TRUST_CERTIFICATES
          value: "/run/secrets/life-ca-certs/life-root-ca-2.pem"
        volumeMounts:
        - name: dsf-creds
          mountPath: /run/secrets/creds/dsf
          readOnly: true
        - name: common-creds
          mountPath: /run/secrets/creds/common
          readOnly: true
        - name: ca-certs
          mountPath: /run/secrets/life-ca-certs
          readOnly: true
        - name: truststore
          mountPath: /run/secrets/truststore
        - name: process-plugins
          mountPath: /opt/bpe/process
        - name: debug-logs
          mountPath: /opt/bpe/log
        startupProbe:
          httpGet: &probe
            path: /bpe/status
            port: health
          failureThreshold: 24
          periodSeconds: 10
        readinessProbe:
          httpGet: *probe
        livenessProbe:
          httpGet: *probe
        resources:
          requests:
            cpu: "125m"
            memory: "2Gi"
          limits:
            memory: "2Gi"
      volumes:
      - name: dsf-creds
        secret:
          secretName: fdpg-dsf-creds
          items:
          - key: cert
            path: cert.pem
          - key: pkey
            path: key.pem
            mode: 0400
      - name: common-creds
        secret:
          secretName: credentials
          items:
          - key: FDPG_DSF_BPE_RD_HDS_CLIENT_SECRET
            path: fdpg_dsf_bpe_rd_hds_client_secret.password
            mode: 0400
      - name: ca-certs
        configMap:
          name: life-ca-certs
          items:
          - key: life-root-ca-2.pem
            path: life-root-ca-2.pem
      - name: process-plugins
        emptyDir: {}
      - name: download-plugins-script
        configMap:
          name: bpe-download-plugins-script
          defaultMode: 0555
      - name: truststore
        emptyDir: {}
      - name: debug-logs
        emptyDir: {}