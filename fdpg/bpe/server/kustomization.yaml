apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/component: server

resources:
- depl.yml
- svc.yml
- ing.yml
- netpol.yaml

configMapGenerator:
- name: bpe-download-plugins-script
  files:
  - download-plugins.sh
  - process-plugins.yaml
- name: bpe-process-config
  envs:
  - process-excluded.env
