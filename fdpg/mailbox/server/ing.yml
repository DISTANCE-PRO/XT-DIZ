apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fdpg-mailbox-server
spec:
  rules:
  # Public zone (.de) — the only external-facing DIZ endpoint
  - host: ${DIZ_NAME}.distance-xt.life.uni-leipzig.de
    http:
      paths:
      - path: /fhir
        pathType: Prefix
        backend:
          service:
            name: fdpg-mailbox-server
            port:
              name: http
