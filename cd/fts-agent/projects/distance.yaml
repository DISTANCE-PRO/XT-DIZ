dataSelector:
  everything:
    fhirServer:
      baseUrl: http://cd-hds-backend/fhir
      auth:
        oauth2:
          registration: diz

deidentificator:
  deidentifhir:
    trustCenterAgent:
      server:
        baseUrl: http://tc-agent.distance-xt-trust-center
        auth:
          oauth2:
            registration: core
      domains:
        pseudonym: ${DIZ_NAME}
        salt: ${DIZ_NAME}
        dateShift: ${DIZ_NAME}
    maxDateShift: P14D
    dateShiftPreserve: NONE
    deidentifhirConfig: /app/projects/distance/deidentifhir/CDtoTransport.json

bundleSender:
  researchDomainAgent:
    server:
      baseUrl: http://rd-fts-agent
      auth:
        oauth2:
          registration: diz
    project: distance
