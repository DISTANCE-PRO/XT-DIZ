cohortSelector:
  trustCenterAgent:
    server:
      baseUrl: https://tc-agent.distance-xt.life.uni-leipzig.local
      auth:
        oauth2:
          registration: core
    domain: ${DIZ_NAME}
    patientIdentifierSystem: "http://fts.smith.care"
    policySystem: "urn:oid:2.16.840.1.113883.3.1937.777.24.5.3"
    policies:
    - 2.16.840.1.113883.3.1937.777.24.5.3.2  # IDAT erheben
    - 2.16.840.1.113883.3.1937.777.24.5.3.3  # IDAT speichern, verarbeiten
    - 2.16.840.1.113883.3.1937.777.24.5.3.6  # MDAT erheben
    - 2.16.840.1.113883.3.1937.777.24.5.3.7  # MDAT speichern, verarbeiten

dataSelector:
  everything:
    fhirServer:
      baseUrl: http://cd-hds-backend/fhir
      auth:
        oauth2:
          registration: diz

deidentificator:
  deidentifhir:
    trustCenterAgent:
      server:
        baseUrl: https://tc-agent.distance-xt.life.uni-leipzig.local
        auth:
          oauth2:
            registration: core
      domains:
        pseudonym: ${DIZ_NAME}
        salt: ${DIZ_NAME}
        dateShift: ${DIZ_NAME}
    maxDateShift: P14D
    dateShiftPreserve: NONE
    deidentifhirConfig: /app/projects/distance/deidentifhir/CDtoTransport.profile

bundleSender:
  researchDomainAgent:
    server:
      baseUrl: http://rd-fts-agent
      auth:
        oauth2:
          registration: diz
    project: distance
