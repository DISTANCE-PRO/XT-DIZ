stages: [ prepare, test, plan, deploy ]

include:
- component: $CI_SERVER_FQDN/util/k8s-ci/kustomize@0.3.1
  inputs:
    prune: [ core/v1/Secret, core/v1/ConfigMap,
             apps/v1/StatefulSet, apps/v1/Deployment,
             batch/v1/CronJob,
             core/v1/Service, networking.k8s.io/v1/Ingress,
             networking.k8s.io/v1/NetworkPolicy ]
    envsubst: [ DIZ_NAME ]
- component: ${CI_SERVER_FQDN}/util/terraform-component/validate@main
  inputs:
    stage: test
- component: ${CI_SERVER_FQDN}/util/terraform-component/plan@main
  inputs:
    stage: plan

# DIZ names, single source of truth. Consumed by the app/deploy:prod matrix
# below, by Terraform (main.tf), and by .gitlab-ci/genseeds.sh. Onboard a new
# DIZ by appending its slug here and defining PASSWORD_SEED_<DIZ>.
.dizs: &dizs
- test-1

deidentifhir/merge:
  stage: prepare
  image:
    name: jbangdev/jbang:0.138.0-java-21
    entrypoint: [ "" ]
  variables:
    # Point the JBang cache to the project directory so GitLab can cache it
    JBANG_CACHE_DIR: "$CI_PROJECT_DIR/.jbang-cache"
  before_script:
  - cd cd/fts-agent/deidentifhir
  script:
  - jbang resolve.java > CDtoTransport.json
  cache:
    key: jbang-deps-cache
    paths:
    - .jbang-cache/
  artifacts:
    paths: [ "cd/fts-agent/deidentifhir/CDtoTransport.json" ]
    expire_in: 1 week

.tf/init:
  # Build the per-DIZ TF_VAR_password_seeds map. genseeds.sh reads the DIZ
  # list from the .dizs anchor in this file and looks up each
  # PASSWORD_SEED_<DIZ> CI variable.
  before_script:
  - apk add --no-cache -q yq jq bash
  - export TF_VAR_password_seeds="$(bash ./.gitlab-ci/genseeds.sh)"

tf/format:
  needs: [ ]

tf/validate:
  needs: [ ]

.app/apply:
  needs: [ deidentifhir/merge ]
  before_script:
  - apk add glab openssl
  - ./.gitlab-ci/generate-process-env.sh
  - ./.gitlab-ci/download-secrets.sh "$DIZ_NAME" .secrets/certs
  - ./.gitlab-ci/generate-thumbprints.sh .secrets/certs .secrets/thumbprints
  - ./.gitlab-ci/create-credentials-env.sh .secrets/credentials.env
  - kustomize edit add secret credentials
    --from-env-file=.secrets/credentials.env
  - kustomize edit add secret fdpg-dsf-creds
    --from-file=cert=.secrets/certs/fdpg-dsf-client-cert.pem
    --from-file=pkey=.secrets/certs/fdpg-dsf-private-key.pem
  - kustomize edit add secret rp-dsf-creds
    --from-file=cert=.secrets/certs/rp-dsf-client-cert.pem
    --from-file=pkey=.secrets/certs/rp-dsf-private-key.pem
    --from-file=thumbprints=.secrets/thumbprints

# Validate with a fixed placeholder DIZ and its matching secure files.
app/validate:
  variables:
    DIZ_NAME: test-1

app/deploy:test:
  rules:
  - when: never

app/deploy:prod:
  parallel:
    matrix:
    - DIZ_NAME: *dizs
  needs:
  - job: tf/check-changes
  - job: deidentifhir/merge
  - job: app/validate
    artifacts: false
  environment:
    # We use a fixed KUBE_CLUSTER from CI/CD variables,
    # so we can use the DIZ name as the environment
    name: $DIZ_NAME
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_MERGE_REQUEST_LABELS =~ /hint::autodeploy/
  - when: manual
  resource_group: production
